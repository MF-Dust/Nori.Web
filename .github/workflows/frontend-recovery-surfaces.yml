name: Frontend recovery surfaces

on:
  pull_request:
    paths:
      - 'frontend-src/**'
      - 'scripts/**'
      - 'tests/frontend-*.tsx'
      - 'package*.json'
      - '.github/workflows/frontend-recovery-surfaces.yml'

permissions:
  contents: read

jobs:
  surface:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        surface: [cold-open, messenger, boot-corruption, memory-datasea, farewell-ending]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke_frontend_recovery_surfaces.mjs '${{ matrix.surface }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-surface-${{ matrix.surface }}-${{ github.sha }}
          path: frontend-surfaces-smoke/
          retention-days: 7
          if-no-files-found: warn

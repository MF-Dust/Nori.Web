name: Settings Runtime

on:
  pull_request:
    paths:
      - "rust/crates/nori-core/src/llm.rs"
      - "rust/crates/nori-core/src/tts.rs"
      - "rust/crates/nori-core/src/session.rs"
      - "rust/crates/nori-core/src/events.rs"
      - "public/nori-ai-*.js"
      - "public/nori-tts-*.js"
      - "public/nori-runtime-shims.js"
      - "public/nori-ui-settings.js"
      - "public/nori-wallpaper-mode.js"
      - "public/wallpaper.html"
      - "public/index.html"
      - ".github/workflows/settings-runtime.yml"
  push:
    branches:
      - master
    paths:
      - "rust/crates/nori-core/src/llm.rs"
      - "rust/crates/nori-core/src/tts.rs"
      - "rust/crates/nori-core/src/session.rs"
      - "rust/crates/nori-core/src/events.rs"
      - "public/nori-ai-*.js"
      - "public/nori-tts-*.js"
      - "public/nori-runtime-shims.js"
      - "public/nori-ui-settings.js"
      - "public/nori-wallpaper-mode.js"
      - "public/wallpaper.html"
      - "public/index.html"
      - ".github/workflows/settings-runtime.yml"

jobs:
  validate-settings-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Verify AI, TTS, session, and event runtime
        run: cargo test --locked -p nori-core --manifest-path rust/Cargo.toml

      - name: Verify compatibility JavaScript syntax
        run: |
          node --check public/nori-ai-settings.js
          node --check public/nori-ai-provider-switch.js
          node --check public/nori-tts-settings.js
          node --check public/nori-runtime-shims.js
          node --check public/nori-ui-settings.js
          node --check public/nori-wallpaper-mode.js

      - name: Verify wallpaper entry wiring
        run: |
          grep -q 'nori-wallpaper-mode.js' public/index.html
          grep -q 'wallpaper' public/wallpaper.html
          grep -q 'interactive' public/nori-wallpaper-mode.js

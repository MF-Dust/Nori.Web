name: Frontend Files Evidence

on:
  push:
    branches:
      - dev/frontend-source-cutover
    paths:
      - ".github/workflows/frontend-files-evidence.yml"

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture Files runtime evidence
        shell: bash
        env:
          FRONTEND_INSPECT_SNIPPET: "30000"
          FRONTEND_INSPECT_DEPTH: "3"
          FRONTEND_INSPECT_EXPORTS: "Q,R,b6,b7,I,z,aE,aS,E,aM,V,bd,be,Y"
          FRONTEND_IDENTIFIER_CONTEXT: "8000"
          FRONTEND_IDENTIFIER_STATEMENT: "36000"
          FRONTEND_IDENTIFIER_MATCHES: "180"
        run: |
          mkdir -p frontend-files-evidence
          node scripts/inspect_frontend_chunk.mjs NormalApp- > frontend-files-evidence/normalapp-files-exports.json
          node scripts/inspect_frontend_identifier.mjs NormalApp- folderPath vaultPath openEmitsFact openSentinelFact threshold tierOrder qfr coldVolume decrypting > frontend-files-evidence/normalapp-files-identifiers.json
          cp public/assets/NormalApp-Cn6agT0F.js frontend-files-evidence/normalapp.bundle.js
          cp public/assets/FilesScreen-BmorLrPA.js frontend-files-evidence/files-screen.bundle.js
          cp public/assets/SealedVolumeAlert-CLn2CcA9.js frontend-files-evidence/sealed-volume.bundle.js
          cp public/assets/tree-BwnCy3ce.js frontend-files-evidence/tree.bundle.js

      - name: Upload Files evidence
        uses: actions/upload-artifact@v4
        with:
          name: frontend-files-evidence-${{ github.sha }}
          path: frontend-files-evidence/
          if-no-files-found: error
          retention-days: 1

name: Finalize Signal Messenger Recovery

on:
  push:
    branches:
      - dev/frontend-source-cutover
    paths:
      - ".github/workflows/apply-signal-daniel.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/frontend-source-cutover
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Finalize Signal Messenger boundary
        run: node scripts/apply_signal_daniel_screen_patch.mjs

      - name: Verify finalized source
        run: |
          npm run frontend:typecheck
          npm run frontend:build
          npm run frontend:app:build
          npm run frontend:cutover:check
          npm run frontend:recover:check

      - name: Commit finalized boundary
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(frontend): close Signal Messenger recovery boundary"
          git push origin HEAD:dev/frontend-source-cutover

# Retry after resolving the public barrel type-name collision.

name: Apply Signal Daniel Patch

on:
  push:
    branches:
      - dev/frontend-source-cutover
    paths:
      - ".github/workflows/apply-signal-daniel.yml"
      - "scripts/apply_signal_daniel_screen_patch.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/frontend-source-cutover
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply evidence-backed Messenger patch
        run: node scripts/apply_signal_daniel_screen_patch.mjs

      - name: Typecheck patched source
        run: npm run frontend:typecheck

      - name: Commit patched Messenger screen
        shell: bash
        run: |
          if git diff --quiet -- frontend-src/screens/messenger-screen.tsx; then
            echo "No Messenger patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-src/screens/messenger-screen.tsx
          git commit -m "feat(frontend): wire Daniel runtime into Messenger screen"
          git push origin HEAD:dev/frontend-source-cutover

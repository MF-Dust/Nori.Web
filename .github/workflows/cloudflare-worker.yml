name: Cloudflare Worker

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Rust
        # Same toolchain as scripts/cloudflare_builds_deploy.py RUST_TOOLCHAIN.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Test Rust core and Worker
        run: cargo test --locked -p nori-core -p nori-worker --manifest-path rust/Cargo.toml

      - name: Cache worker-build
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-${{ runner.os }}-0.8.7

      - name: Install worker-build
        run: |
          if ! command -v worker-build || [ "$(worker-build --version)" != "0.8.7" ]; then
            cargo install worker-build --version 0.8.7 --locked
          fi

      - name: Set up Python for deploy wrapper tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Workers Builds deploy wrapper
        run: python tests/test_cloudflare_builds_deploy.py

      - name: Verify browser compatibility JavaScript
        run: |
          node --check public/nori-ai-settings.js
          node --check public/nori-runtime-shims.js

      - name: Dry-run Rust Cloudflare bundle
        shell: bash
        run: |
          set -euo pipefail
          outdir=$(mktemp -d "$RUNNER_TEMP/nori-worker.XXXXXX")
          log="$RUNNER_TEMP/wrangler.log"
          set +e
          npx wrangler deploy --dry-run --config wrangler.jsonc --outdir "$outdir" > "$log" 2>&1
          code=$?
          set -e
          tail -n 120 "$log"
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          if grep -Fq "Unexpected fields found" "$log"; then
            echo "::error::Wrangler rejected one or more configuration fields"
            exit 1
          fi
          if grep -Fq "backend/data/live_world_pack.json" "$log" || find "$outdir" -type f -name 'live_world_pack.json' -print -quit | grep -q .; then
            echo "::error::The live-world archive leaked into the Worker bundle instead of R2"
            exit 1
          fi
          node --input-type=module - "$outdir" <<'NODE'
          import assert from "node:assert/strict";
          import { readdirSync, readFileSync } from "node:fs";
          import { join } from "node:path";
          import { gzipSync } from "node:zlib";
          const files = readdirSync(process.argv[2], { recursive: true })
            .filter(path => path.endsWith(".wasm"));
          assert.ok(files.length, "Worker output is missing its WASM module");
          const bytes = files.reduce((total, path) => total + gzipSync(readFileSync(join(process.argv[2], path))).length, 0);
          console.log(`Worker WASM gzip size: ${(bytes / 1024).toFixed(2)} KiB`);
          assert.ok(bytes < 3 * 1024 * 1024, "Worker WASM must stay below 3 MiB gzipped");
          NODE

  frontend-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck reconstructed frontend source
        run: npm run frontend:typecheck

      - name: Build source-driven frontend application
        run: npm run frontend:app:build

      - name: Verify frontend connections and media
        run: npm run frontend:runtime:test

      - name: Verify production story contracts
        run: npm run frontend:stories:test

      - name: Verify historical asset ownership scanner
        run: npm run frontend:ownership:test

      - name: Verify recovered games and story suites
        run: |
          npm run frontend:games:test
          npm run frontend:suites:test

      - name: Install browser for recovered game checks
        run: npx playwright install --with-deps chromium

      - name: Verify recovered games in Chromium
        run: npm run frontend:games:smoke

      - name: Set up Rust for source application smoke
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Test cartridges and build local backend
        run: |
          cargo test --locked -p nori-core --manifest-path rust/Cargo.toml
          cargo build --release -p nori-local --manifest-path rust/Cargo.toml

      - name: Verify source application against local backend
        run: npm run frontend:app:smoke

      - name: Upload source application screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-${{ github.sha }}
          path: .artifacts/app-smoke/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload recovered game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: games-smoke-${{ github.sha }}
          path: .artifacts/games-smoke/
          if-no-files-found: warn
          retention-days: 7

name: Cloudflare Worker

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Rust
        # Same toolchain as scripts/cloudflare_builds_deploy.py RUST_TOOLCHAIN.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Test Rust core and Worker
        run: cargo test --locked -p nori-core -p nori-worker --manifest-path rust/Cargo.toml

      - name: Cache worker-build
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-${{ runner.os }}-0.8.7

      - name: Install worker-build
        run: |
          if ! command -v worker-build || [ "$(worker-build --version)" != "0.8.7" ]; then
            cargo install worker-build --version 0.8.7 --locked
          fi

      - name: Set up Python for deploy wrapper tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Workers Builds deploy wrapper
        run: python tests/test_cloudflare_builds_deploy.py

      - name: Verify browser compatibility JavaScript
        run: |
          node --check public/nori-ai-settings.js
          node --check public/nori-runtime-shims.js

      - name: Verify frontend recovery tool JavaScript
        run: |
          node --check scripts/recovery/recover_frontend.mjs
          node --check scripts/inspect/inventory_frontend_symbols.mjs
          node --check scripts/inspect/inspect_frontend_chunk.mjs
          node --check scripts/inspect/inspect_frontend_identifier.mjs
          node --check scripts/recovery/run_frontend_recovery.mjs
          node --check scripts/verify/verify_frontend_recovery.mjs
          node --check scripts/verify/verify_frontend_cutover.mjs

      - name: Dry-run Rust Cloudflare bundle
        shell: bash
        run: |
          set -euo pipefail
          outdir=$(mktemp -d "$RUNNER_TEMP/nori-worker.XXXXXX")
          log="$RUNNER_TEMP/wrangler.log"
          set +e
          npx wrangler deploy --dry-run --config wrangler.jsonc --outdir "$outdir" > "$log" 2>&1
          code=$?
          set -e
          tail -n 120 "$log"
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          if grep -Fq "Unexpected fields found" "$log"; then
            echo "::error::Wrangler rejected one or more configuration fields"
            exit 1
          fi
          if grep -Fq "backend/data/live_world_pack.json" "$log" || find "$outdir" -type f -name 'live_world_pack.json' -print -quit | grep -q .; then
            echo "::error::The live-world archive leaked into the Worker bundle instead of R2"
            exit 1
          fi
          node --input-type=module - "$outdir" <<'NODE'
          import assert from "node:assert/strict";
          import { readdirSync, readFileSync } from "node:fs";
          import { join } from "node:path";
          import { gzipSync } from "node:zlib";
          const files = readdirSync(process.argv[2], { recursive: true })
            .filter(path => path.endsWith(".wasm"));
          assert.ok(files.length, "Worker output is missing its WASM module");
          const bytes = files.reduce((total, path) => total + gzipSync(readFileSync(join(process.argv[2], path))).length, 0);
          console.log(`Worker WASM gzip size: ${(bytes / 1024).toFixed(2)} KiB`);
          assert.ok(bytes < 3 * 1024 * 1024, "Worker WASM must stay below 3 MiB gzipped");
          NODE

  frontend-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Inspect NormalApp window store
        shell: bash
        env:
          FRONTEND_INSPECT_SNIPPET: "12000"
          FRONTEND_INSPECT_DEPTH: "2"
          FRONTEND_INSPECT_EXPORTS: "O,aD,aE,bA,bD,bg,bi,g,h,v,w,x,y,z"
          FRONTEND_IDENTIFIER_CONTEXT: "7000"
          FRONTEND_IDENTIFIER_STATEMENT: "30000"
          FRONTEND_IDENTIFIER_MATCHES: "160"
        run: |
          mkdir -p normalapp-inspection
          npm run frontend:inspect:normalapp > normalapp-inspection/abi.json
          npm run frontend:inspect:identifier -- NormalApp- st XOe GOe launchApp quitApp createWindow focusWindow closeWindow minimizeWindow snapWindow toggleMaximize updateWindowPosition updateWindowRect setWindowTitle navigateScreen goBackScreen getAppContext > normalapp-inspection/window-store-identifiers.json
          npm run frontend:inspect:identifier -- NormalApp- Ti Wt sr dl qh S1 WOe _F xv qn ph B4 '$9e' Y9e VK GK H9e j9e JK ZK OS FS Dv a9e FOe BOe D4 u9e l9e n9e t9e f9e h9e > normalapp-inspection/window-ui-identifiers.json
          npm run frontend:inspect:identifier -- NormalApp- ed mi gX NOe OOe s2e LOe bOe oOe cOe fOe fX xAe UPe jPe rOe a2e c2e sAe mOe > normalapp-inspection/app-registry-identifiers.json
          npm run frontend:inspect:identifier -- NormalApp- vV ZGe VGe YGe KGe > normalapp-inspection/desktop-shell-identifiers.json
          npm run frontend:inspect:identifier -- NormalApp- UGe wGe xGe yGe SGe OGe z4 HS J9e uGe pGe mGe lGe cGe _Ge fGe MOe PGe IGe BGe > normalapp-inspection/dock-identifiers.json
          npm run frontend:inspect:identifier -- NormalApp- H8e '$Ge' qGe XGe '$K' q4 Z9e So '$4' rl eY > normalapp-inspection/shell-presentation-identifiers.json
          FRONTEND_INSPECT_EXPORTS="co,cp,cq,cr,ct,cu,cv" FRONTEND_INSPECT_DEPTH="2" FRONTEND_INSPECT_SNIPPET="20000" node scripts/inspect/inspect_frontend_chunk.mjs index-CyHAbkO5.js > normalapp-inspection/window-layout-exports.json

      - name: Upload NormalApp inspection report
        uses: actions/upload-artifact@v4
        with:
          name: normalapp-inspection-${{ github.sha }}
          path: normalapp-inspection/
          if-no-files-found: error
          retention-days: 1

      - name: Inspect remaining migration chunks
        shell: bash
        env:
          FRONTEND_INSPECT_SNIPPET: "24000"
          FRONTEND_INSPECT_DEPTH: "2"
          FRONTEND_IDENTIFIER_CONTEXT: "5000"
          FRONTEND_IDENTIFIER_STATEMENT: "24000"
          FRONTEND_IDENTIFIER_MATCHES: "120"
        run: |
          mkdir -p .artifacts/cutover-inspection
          node scripts/inspect/inspect_frontend_chunk.mjs BrowserPageView-drqjbn-z.js > .artifacts/cutover-inspection/browser-page-view.json
          node scripts/inspect/inspect_frontend_chunk.mjs BrowserApp-BM1_j6Y4.js > .artifacts/cutover-inspection/browser-app.json
          node scripts/inspect/inspect_frontend_chunk.mjs ChatPanel-BVBzPw5d.js > .artifacts/cutover-inspection/chat-panel.json
          node scripts/inspect/inspect_frontend_chunk.mjs MailScreen-CHwo7Des.js > .artifacts/cutover-inspection/mail-screen.json
          node scripts/inspect/inspect_frontend_chunk.mjs FilesScreen-BmorLrPA.js > .artifacts/cutover-inspection/files-screen.json
          node scripts/inspect/inspect_frontend_chunk.mjs MessengerScreen-BaCtXRiF.js > .artifacts/cutover-inspection/messenger-screen.json
          node scripts/inspect/inspect_frontend_chunk.mjs ChessScreen-D3ynrc3S.js > .artifacts/cutover-inspection/chess-screen.json
          node scripts/inspect/inspect_frontend_chunk.mjs GameScreen-BU9F4fB5.js > .artifacts/cutover-inspection/game-screen-a.json
          node scripts/inspect/inspect_frontend_chunk.mjs GameScreen-BbDAUsf1.js > .artifacts/cutover-inspection/game-screen-b.json
          node scripts/inspect/inspect_frontend_chunk.mjs GameScreen-CgEXO_XJ.js > .artifacts/cutover-inspection/game-screen-c.json
          node scripts/inspect/inspect_frontend_chunk.mjs IdleScreen-DCDB640k.js > .artifacts/cutover-inspection/idle-screen.json
          node scripts/inspect/inspect_frontend_chunk.mjs QfrDock-D2m-2E_A.js > .artifacts/cutover-inspection/qfr-dock.json
          node scripts/inspect/inspect_frontend_identifier.mjs index-CyHAbkO5.js preloadLive2DModel NoriSceneStage Live2D Cubism > .artifacts/cutover-inspection/entry-live2d-identifiers.json
          node scripts/inspect/inspect_frontend_identifier.mjs NormalApp- preloadLive2DModel NoriSceneStage Live2D Cubism > .artifacts/cutover-inspection/normalapp-live2d-identifiers.json
          FRONTEND_IDENTIFIER_CONTEXT=8000 FRONTEND_IDENTIFIER_STATEMENT=30000 FRONTEND_IDENTIFIER_MATCHES=160 node scripts/inspect/inspect_frontend_identifier.mjs NormalApp- KL gV Ktt Xtt cY MY wHe pHe yHe xHe > .artifacts/cutover-inspection/signal-messenger-runtime.json

      - name: Upload frontend cutover inspection report
        uses: actions/upload-artifact@v4
        with:
          name: cutover-inspection-${{ github.sha }}
          path: .artifacts/cutover-inspection/
          if-no-files-found: error
          retention-days: 2

      - name: Typecheck reconstructed frontend source
        run: npm run frontend:typecheck

      - name: Build reconstructed frontend source library
        run: npm run frontend:build

      - name: Build source-driven frontend application
        run: npm run frontend:app:build

      - name: Verify frontend connections and media
        run: npm run frontend:runtime:test

      - name: Verify production story contracts
        run: npm run frontend:stories:test

      - name: Verify historical asset ownership scanner
        run: npm run frontend:ownership:test

      - name: Verify frontend cutover gate
        run: npm run frontend:cutover:check

      - name: Verify complete bundle recovery coverage
        run: npm run frontend:recover:check

      - name: Install browser for recovered game checks
        run: npx playwright install --with-deps chromium

      - name: Verify recovered games in Chromium
        run: npm run frontend:games:smoke

      - name: Set up Rust for source application smoke
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Test cartridges and build local backend
        run: |
          cargo test --locked -p nori-core --manifest-path rust/Cargo.toml
          cargo build --release -p nori-local --manifest-path rust/Cargo.toml

      - name: Verify source application against local backend
        run: npm run frontend:app:smoke

      - name: Upload source application screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-${{ github.sha }}
          path: .artifacts/app-smoke/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload recovered game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: games-smoke-${{ github.sha }}
          path: .artifacts/games-smoke/
          if-no-files-found: warn
          retention-days: 7

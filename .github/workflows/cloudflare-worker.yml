name: Cloudflare Worker

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync Python dependencies
        run: uv sync --group dev --python 3.13

      - name: Verify stateless tickets
        run: uv run python tests/test_cloudflare_ticket.py

      - name: Verify Cloudflare import safety
        run: uv run python tests/test_cloudflare_import_safety.py

      - name: Verify runtime live pack injection
        run: uv run python tests/test_live_pack_runtime.py

      - name: Verify Durable Object hibernation snapshots
        run: uv run python tests/test_durable_world_snapshot.py

      - name: Verify Durable Object hibernation source path
        run: uv run python tests/test_durable_object_hibernation.py

      - name: Verify Durable Object runtime efficiency
        run: uv run python tests/test_do_runtime_efficiency.py

      - name: Verify Durable Object active-window pacing
        run: uv run python tests/test_do_active_window_pacing.py

      - name: Verify static asset cache policy
        run: uv run python tests/test_static_asset_cache.py

      - name: Verify local access gate
        run: uv run python tests/test_local_access_gate.py

      - name: Verify Workers Builds deploy wrapper
        run: uv run python tests/test_cloudflare_builds_deploy.py

      - name: Verify browser AI settings
        run: uv run python tests/test_ai_runtime_settings.py

      - name: Verify browser AI settings JavaScript
        run: node --check public/nori-ai-settings.js

      - name: Verify browser runtime shim
        run: uv run python tests/test_browser_runtime_shims.py

      - name: Verify browser runtime shim JavaScript
        run: node --check public/nori-runtime-shims.js

      - name: Compile Python sources
        run: uv run python -m compileall -q backend scripts server.py worker.py

      - name: Dry-run Cloudflare bundle
        shell: bash
        run: |
          set +e
          uv run pywrangler deploy --dry-run --outdir .worker-dist > /tmp/pywrangler.log 2>&1
          code=$?
          tail -n 120 /tmp/pywrangler.log
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          if grep -Fq "Unexpected fields found" /tmp/pywrangler.log; then
            echo "::error::Wrangler rejected one or more configuration fields"
            exit 1
          fi
          if ! grep -Fq "backend/data/codenames_words.json" /tmp/pywrangler.log; then
            echo "::error::Cloudflare bundle is missing backend/data/codenames_words.json"
            exit 1
          fi
          if ! grep -Fq "backend/data/pictionary_words.json" /tmp/pywrangler.log; then
            echo "::error::Cloudflare bundle is missing backend/data/pictionary_words.json"
            exit 1
          fi
          if grep -Fq "backend/data/live_world_pack.json" /tmp/pywrangler.log; then
            echo "::error::The large live-world archive leaked into the Worker bundle instead of R2"
            exit 1
          fi
          if grep -Eq "public/.*\.(bin|wasm)" /tmp/pywrangler.log; then
            echo "::error::Static public binary/WASM assets leaked into the Worker module bundle"
            exit 1
          fi
          if grep -Eq "node_modules/.*\.wasm" /tmp/pywrangler.log; then
            echo "::error::Node development WASM leaked into the Worker module bundle"
            exit 1
          fi
          if grep -Eq '│ (tests/|scraper/|\.venv[^/]*/)' /tmp/pywrangler.log; then
            echo "::error::Development Python files leaked into the Worker module bundle"
            exit 1
          fi
          gzip_kib=$(sed -n 's/.*gzip: \([0-9.]*\) KiB.*/\1/p' /tmp/pywrangler.log | tail -n 1)
          if [ -z "$gzip_kib" ]; then
            echo "::error::Unable to determine Cloudflare Worker gzip size"
            exit 1
          fi
          echo "Cloudflare Worker gzip size: ${gzip_kib} KiB"
          awk -v size="$gzip_kib" 'BEGIN { if (size >= 3072) exit 1 }' || {
            echo "::error::Cloudflare Worker gzip bundle must stay below the Free-plan 3 MiB limit (3072 KiB)"
            exit 1
          }

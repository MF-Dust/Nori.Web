name: 功能请求
description: 为 Nori.Web 提出一项新的功能或交互改进。
title: "【功能】（替换为简要功能描述）"
body:
  - type: markdown
    attributes:
      value: |
        感谢您贡献想法。请使用简洁明确的标题，**每项独立功能单独开一个 Issue**。
        提交前请查阅 [README](https://github.com/MF-Dust/Nori.Web#readme)、[项目文档](https://github.com/MF-Dust/Nori.Web/tree/master/docs) 和已有 Issues。
        请在正文说明需求；原型图、参考视频等可直接通过 GitHub 附件上传。请勿附带密钥或私人信息。
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已经仔细阅读过选项里的内容，并且知道这个选项不用勾选。
        - label: 我已检查最新版本及已有 Issues，确认没有相同功能或请求。
          required: true
        - label: 该需求与 Nori.Web 的浏览器体验、应用、剧情或 AI / 语音功能相关。
          required: true
        - label: 我理解功能请求需要评估，不保证立即实现。
          required: true
  - type: textarea
    id: background
    attributes:
      label: 背景与动机
      description: 目前遇到什么问题？谁会使用此功能，为什么需要它？
    validations:
      required: true
  - type: textarea
    id: requested-feature
    attributes:
      label: 想要实现或优化的功能
      description: 描述具体行为，以及与已有应用或设置的关系。
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: 期望效果
      description: 描述用户操作、界面反馈和最终结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 参考资料（可选）
      description: 当前的变通方式、其他设计方案或参考截图。

[project]
name = "nori-web"
version = "2.0.0"
description = "Build, deployment and archive helpers for the NoriOS Rust backend"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "COPYRIGHT.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
scrape = ["websockets>=13"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["python_modules", ".venv-workers"]

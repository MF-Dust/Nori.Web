[workspace]
resolver = "2"
members = ["crates/nori-core", "crates/nori-local", "crates/nori-worker"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
# Verified toolchain; also >= every locked crate (shakmaty 0.30.1 needs 1.95).
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
uuid = "1"
shakmaty = "0.30"
rand = "0.9"
getrandom = "0.3"
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "signal", "sync", "net", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
http = "1"
worker = "0.8.7"
futures-util = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[profile.release.package."*"]
opt-level = "z"
codegen-units = 1
